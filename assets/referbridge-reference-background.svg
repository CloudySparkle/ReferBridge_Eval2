<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#06101e"/><stop offset=".5" stop-color="#071a2a"/><stop offset="1" stop-color="#0a2d3d"/>
 </linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#173f58"/><stop offset="1" stop-color="#0b2333"/>
 </linearGradient>
 <linearGradient id="ecg" x1="0" x2="1">
  <stop stop-color="#1bc9ff" stop-opacity=".05"/><stop offset=".48" stop-color="#20e5cf"/><stop offset=".72" stop-color="#29cfff"/><stop offset="1" stop-color="#20e5cf" stop-opacity=".05"/>
 </linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#6cb9dc" stroke-opacity=".035"/></pattern>
</defs>

<rect width="1800" height="1000" fill="url(#bg)"/>
<rect width="1800" height="1000" fill="url(#grid)"/>
<circle cx="420" cy="210" r="330" fill="#078df2" opacity=".08" filter="url(#blur)"/>
<circle cx="1040" cy="170" r="300" fill="#6e58ff" opacity=".09" filter="url(#blur)"/>
<circle cx="1510" cy="820" r="350" fill="#18d7cc" opacity=".08" filter="url(#blur)"/>

<!-- network constellation -->
<g fill="none" stroke="#49c9ff" stroke-opacity=".20" stroke-width="1.4">
 <path d="M530 130L700 210L860 105L1020 235L900 350L700 315L530 130"/>
 <path d="M700 210L700 315M860 105L900 350M1020 235L900 350"/>
 <path d="M410 395L600 475L700 315M600 475L900 350"/>
 <path d="M1060 120L1210 70L1350 180L1240 290L1080 240Z"/>
</g>
<g fill="#5ad8ff">
 <circle cx="530" cy="130" r="3"/><circle cx="700" cy="210" r="4"/><circle cx="860" cy="105" r="3"/>
 <circle cx="1020" cy="235" r="4"/><circle cx="900" cy="350" r="4"/><circle cx="700" cy="315" r="3"/>
 <circle cx="410" cy="395" r="3"/><circle cx="600" cy="475" r="4"/>
 <circle cx="1060" cy="120" r="3"/><circle cx="1210" cy="70" r="4"/><circle cx="1350" cy="180" r="3"/><circle cx="1240" cy="290" r="4"/>
</g>

<!-- hospital on the RIGHT -->
<g transform="translate(1200 245)">
 <ellipse cx="290" cy="540" rx="440" ry="90" fill="#18d9cf" opacity=".07" filter="url(#blur)"/>
 <rect x="45" y="90" width="600" height="450" rx="10" fill="#071a2b" stroke="#4ccfff" stroke-opacity=".22"/>
 <rect x="420" y="20" width="225" height="520" rx="8" fill="url(#glass)" stroke="#56d7ff" stroke-opacity=".20"/>
 <rect x="0" y="180" width="155" height="360" rx="8" fill="#0b2538" stroke="#56d7ff" stroke-opacity=".15"/>
 <!-- roof/cross -->
 <g transform="translate(505 -35)" filter="url(#glow)">
  <rect x="42" y="0" width="42" height="115" rx="6" fill="#18d9ca"/>
  <rect x="0" y="37" width="126" height="42" rx="6" fill="#18d9ca"/>
 </g>
 <!-- glass windows -->
 <g fill="#72d4f4" opacity=".30">
  <g>
   <rect x="90" y="130" width="42" height="32"/><rect x="155" y="130" width="42" height="32"/><rect x="220" y="130" width="42" height="32"/><rect x="285" y="130" width="42" height="32"/><rect x="350" y="130" width="42" height="32"/>
   <rect x="90" y="190" width="42" height="32"/><rect x="155" y="190" width="42" height="32"/><rect x="220" y="190" width="42" height="32"/><rect x="285" y="190" width="42" height="32"/><rect x="350" y="190" width="42" height="32"/>
   <rect x="90" y="250" width="42" height="32"/><rect x="155" y="250" width="42" height="32"/><rect x="220" y="250" width="42" height="32"/><rect x="285" y="250" width="42" height="32"/><rect x="350" y="250" width="42" height="32"/>
   <rect x="90" y="310" width="42" height="32"/><rect x="155" y="310" width="42" height="32"/><rect x="220" y="310" width="42" height="32"/><rect x="285" y="310" width="42" height="32"/><rect x="350" y="310" width="42" height="32"/>
  </g>
  <g transform="translate(440 -10)">
   <rect x="0" y="0" width="42" height="32"/><rect x="65" y="0" width="42" height="32"/><rect x="130" y="0" width="42" height="32"/>
   <rect x="0" y="60" width="42" height="32"/><rect x="65" y="60" width="42" height="32"/><rect x="130" y="60" width="42" height="32"/>
   <rect x="0" y="120" width="42" height="32"/><rect x="65" y="120" width="42" height="32"/><rect x="130" y="120" width="42" height="32"/>
   <rect x="0" y="180" width="42" height="32"/><rect x="65" y="180" width="42" height="32"/><rect x="130" y="180" width="42" height="32"/>
   <rect x="0" y="240" width="42" height="32"/><rect x="65" y="240" width="42" height="32"/><rect x="130" y="240" width="42" height="32"/>
  </g>
 </g>
 <!-- entrance -->
 <rect x="235" y="405" width="190" height="135" rx="6" fill="#06131f" stroke="#24d9cf" stroke-opacity=".35"/>
 <path d="M255 465H405" stroke="#2bd9d0" stroke-opacity=".25"/>
 <!-- ambulance -->
 <g transform="translate(35 495)">
  <rect x="0" y="0" width="150" height="35" rx="8" fill="#d7edf5" opacity=".85"/>
  <rect x="105" y="-9" width="48" height="44" rx="9" fill="#d7edf5" opacity=".9"/>
  <rect x="38" y="8" width="30" height="10" fill="#20cfc8"/><rect x="48" y="0" width="10" height="28" fill="#20cfc8"/>
  <circle cx="30" cy="38" r="8" fill="#07121d"/><circle cx="124" cy="38" r="8" fill="#07121d"/>
 </g>
</g>

<!-- glowing ECG -->
<path d="M0 760H300L330 760L350 738L375 784L400 760H620L650 760L675 705L702 835L730 760H930L960 760L980 738L1005 784L1030 760H1240L1270 760L1295 705L1322 835L1350 760H1560L1590 760L1612 738L1638 784L1665 760H1800"
 fill="none" stroke="url(#ecg)" stroke-width="4" filter="url(#glow)"/>
<path d="M0 835 C280 790 540 875 820 820 S1300 795 1800 845" fill="none" stroke="#25d9d0" stroke-opacity=".12" stroke-width="2"/>
</svg>